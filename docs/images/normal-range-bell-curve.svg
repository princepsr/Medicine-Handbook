<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" role="img" aria-labelledby="t d">
  <title id="t">What a reference range means</title>
  <desc id="d">A bell curve of test results in healthy people. The middle 95 percent is shaded and called the reference range. About 2.5 percent of healthy people fall below it and 2.5 percent above it.</desc>
  <style>
    .title{font:700 20px sans-serif;fill:#134e4a}
    .h{font:700 14px sans-serif;fill:#134e4a}
    .s{font:13px sans-serif;fill:#334155}
    .m{font:13px sans-serif;fill:#134e4a;text-anchor:middle}
    .curve{fill:#f1f5f9;stroke:#0f766e;stroke-width:3}
    .mid{fill:#99f6e4;fill-opacity:0.7}
    .axis{stroke:#94a3b8;stroke-width:2}
    .lim{stroke:#0f766e;stroke-width:2;stroke-dasharray:6 4}
    .note{fill:#fffbeb;stroke:#b45309;stroke-width:2}
    .nt{font:13px sans-serif;fill:#92400e}
  </style>
  <defs><clipPath id="c"><rect x="170" y="20" width="420" height="250"/></clipPath></defs>
  <rect width="760" height="340" fill="#fff" rx="10"/>
  <text x="24" y="34" class="title">What a "normal range" really means</text>
  <path class="curve" d="M60,250 C200,250 260,60 380,60 C500,60 560,250 700,250 Z"/>
  <path class="mid" clip-path="url(#c)" d="M60,250 C200,250 260,60 380,60 C500,60 560,250 700,250 Z"/>
  <line class="axis" x1="50" y1="250" x2="710" y2="250"/>
  <line class="lim" x1="170" y1="250" x2="170" y2="130"/><line class="lim" x1="590" y1="250" x2="590" y2="130"/>
  <text class="m" x="380" y="160" style="font-weight:700;font-size:15px">About 95 of 100 healthy people</text>
  <text class="m" x="380" y="180">fall inside the range</text>
  <text class="m" x="100" y="196">2.5 in 100</text><text class="m" x="100" y="212" style="font-size:12px">healthy people</text>
  <text class="m" x="660" y="196">2.5 in 100</text><text class="m" x="660" y="212" style="font-size:12px">healthy people</text>
  <text class="h" x="170" y="270" style="text-anchor:middle">Lower limit</text>
  <text class="h" x="590" y="270" style="text-anchor:middle">Upper limit</text>
  <text class="s" x="380" y="270" style="text-anchor:middle">test result</text>
  <rect class="note" x="20" y="286" width="720" height="44" rx="8"/>
  <text class="nt" x="36" y="304">So a result just outside the range is common in healthy people and often needs only a repeat.</text>
  <text class="nt" x="36" y="321">With many tests on one report, roughly one or more may be flagged even when nothing is wrong.</text>
</svg>
