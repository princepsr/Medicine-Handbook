<svg viewBox="0 0 760 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Insulin is the key that lets glucose enter cells. In type 1 no key is made; in type 2 the key fits badly.">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#374151"/>
    </marker>
  </defs>
  <rect width="760" height="360" fill="#ffffff"/>
  <text x="380" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#111827">How insulin controls blood sugar</text>

  <rect x="30" y="60" width="150" height="70" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="105" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#78350f">You eat</text>
  <text x="105" y="112" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#78350f">food becomes glucose</text>

  <rect x="230" y="60" width="160" height="70" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="310" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#7f1d1d">Glucose in blood</text>
  <text x="310" y="112" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#7f1d1d">blood sugar rises</text>

  <rect x="440" y="60" width="140" height="70" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="510" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#1e3a8a">Pancreas</text>
  <text x="510" y="112" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#1e3a8a">releases insulin</text>

  <rect x="620" y="60" width="115" height="70" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="677" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#14532d">Cell</text>
  <text x="677" y="112" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#14532d">uses glucose</text>

  <line x1="180" y1="95" x2="228" y2="95" stroke="#374151" stroke-width="2.5" marker-end="url(#a)"/>
  <line x1="390" y1="95" x2="438" y2="95" stroke="#374151" stroke-width="2.5" marker-end="url(#a)"/>
  <line x1="580" y1="95" x2="618" y2="95" stroke="#374151" stroke-width="2.5" marker-end="url(#a)"/>

  <text x="380" y="168" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#111827">Insulin is the KEY. It unlocks the cell door so glucose goes in as fuel, and blood sugar falls back to normal.</text>

  <text x="380" y="210" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#991b1b">When it goes wrong, glucose stays in the blood</text>

  <rect x="30" y="230" width="220" height="100" rx="12" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/>
  <text x="140" y="258" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#111827">Type 1</text>
  <text x="140" y="282" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#111827">No keys are made</text>
  <text x="140" y="302" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#111827">(immune system destroys</text>
  <text x="140" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#111827">the insulin-making cells)</text>

  <rect x="270" y="230" width="220" height="100" rx="12" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/>
  <text x="380" y="258" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#111827">Type 2 (most common)</text>
  <text x="380" y="282" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#111827">Keys fit badly (insulin resistance)</text>
  <text x="380" y="302" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#111827">Later, fewer keys are made</text>

  <rect x="510" y="230" width="220" height="100" rx="12" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/>
  <text x="620" y="258" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#111827">Gestational</text>
  <text x="620" y="282" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#111827">Starts in pregnancy</text>
  <text x="620" y="302" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#111827">Pregnancy hormones make</text>
  <text x="620" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#111827">the keys fit worse</text>
</svg>
