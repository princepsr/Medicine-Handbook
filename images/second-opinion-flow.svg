<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" role="img" aria-labelledby="t d">
  <title id="t">Do I need a second opinion?</title>
  <desc id="d">A decision chart. If it is an emergency, act now. If not, and the advice is a surgery, a stent, a long-term medicine, or a costly package, get a second opinion and ask for the evidence in writing. Otherwise ask the standard questions and decide.</desc>
  <style>
    .q{fill:#e6f4f2;stroke:#0f766e;stroke-width:2}
    .r{fill:#fef2f2;stroke:#b91c1c;stroke-width:2}
    .g{fill:#f0fdf4;stroke:#15803d;stroke-width:2}
    .a{fill:#fffbeb;stroke:#b45309;stroke-width:2}
    .t{font:600 15px sans-serif;fill:#0f172a;text-anchor:middle}
    .s{font:13px sans-serif;fill:#334155;text-anchor:middle}
    .lab{font:700 13px sans-serif;fill:#0f766e}
    .ar{fill:none;stroke:#0f766e;stroke-width:2.5;marker-end:url(#a)}
    .title{font:700 20px sans-serif;fill:#134e4a}
  </style>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/></marker></defs>
  <rect width="760" height="460" fill="#ffffff" rx="10"/>
  <text x="24" y="36" class="title">Do I need a second opinion?</text>

  <rect class="q" x="260" y="56" width="240" height="56" rx="10"/>
  <text class="t" x="380" y="80">Is it an emergency?</text><text class="s" x="380" y="99">Chest pain, stroke signs, bleeding</text>

  <path class="ar" d="M260,84 L170,84 L170,128"/><text class="lab" x="190" y="76">Yes</text>
  <rect class="r" x="70" y="130" width="200" height="64" rx="10"/>
  <text class="t" x="170" y="156">Act now</text><text class="s" x="170" y="176">Call 112 or go to hospital</text>

  <path class="ar" d="M500,84 L590,84 L590,128"/><text class="lab" x="540" y="76">No</text>
  <rect class="q" x="450" y="130" width="280" height="64" rx="10"/>
  <text class="t" x="590" y="156">Is the advice big or permanent?</text><text class="s" x="590" y="174">Surgery, stent, lifelong medicine,</text><text class="s" x="590" y="188">or a costly package?</text>

  <path class="ar" d="M510,194 L430,194 L430,246"/><text class="lab" x="450" y="212">Yes</text>
  <rect class="a" x="290" y="248" width="280" height="86" rx="10"/>
  <text class="t" x="430" y="274">Get a second opinion</text>
  <text class="s" x="430" y="294">Ask for the diagnosis, the evidence,</text><text class="s" x="430" y="312">alternatives and costs in writing</text>

  <path class="ar" d="M670,194 L670,246"/><text class="lab" x="680" y="226">No</text>
  <rect class="g" x="600" y="248" width="150" height="86" rx="10"/>
  <text class="t" x="675" y="276">Ask the</text><text class="t" x="675" y="296">standard questions</text><text class="s" x="675" y="318">then decide</text>

  <rect class="q" x="20" y="366" width="720" height="70" rx="10"/>
  <text class="s" x="380" y="392" style="font-size:14px">Warning signs that you may be pushed: "decide today", a package discount on a procedure,</text>
  <text class="s" x="380" y="412" style="font-size:14px">"stop your tablets", or a single scan or number used to justify surgery for a stable problem.</text>
</svg>
