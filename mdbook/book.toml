[book]
title = "Medical Literacy Handbook (India)"
description = "A private, plain-language guide to understanding your body, reports and medicines, and to spotting misleading advice. Not medical advice."
language = "en"
src = "src"

[build]
build-dir = "book"

[output.html]
default-theme = "light"
preferred-dark-theme = "navy"
smart-punctuation = false
no-section-label = false
additional-css = ["theme/custom.css"]
additional-js = ["theme/custom.js"]

[output.html.search]
enable = true
limit-results = 20
use-boolean-and = true

[output.html.fold]
enable = true
level = 1
